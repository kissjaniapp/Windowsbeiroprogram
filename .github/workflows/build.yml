name: Windows telepito epitese
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Beépített Google kapcsolati adatok előállítása
        run: node scripts/pack-google-config.js
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          GOOGLE_SHARED_KEY: ${{ secrets.GOOGLE_SHARED_KEY }}
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Eredmeny-beiro-Windows
          path: dist/*.exe
